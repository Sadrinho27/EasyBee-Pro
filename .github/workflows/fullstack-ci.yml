name: Full Stack CI/CD (Build & Artifacts)

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  # JOB 1 : Le Backend (Produit un fichier .jar)
  build-backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven
          
      - name: Build Backend JAR
        run: |
          cd easybee-backend
          mvn clean package -DskipTests # On génère le fichier .jar dans le dossier target

      - name: Sauvegarder le JAR (Artifact)
        uses: actions/upload-artifact@v4
        with:
          name: easybee-api-binary
          path: easybee-backend/target/*.jar

  # JOB 2 : Le Frontend (Produit un dossier dist)
  build-frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: easybee-frontend/package-lock.json
          
      - name: Install & Build Frontend
        run: |
          cd easybee-frontend
          npm install
          npm run build

      - name: Sauvegarder le Build React (Artifact)
        uses: actions/upload-artifact@v4
        with:
          name: easybee-frontend-dist
          path: easybee-frontend/dist/